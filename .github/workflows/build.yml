name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # check runs the palette audit; generateThemes runs as part of buildPlugin.
      - name: Audit palettes and build plugin
        run: ./gradlew check buildPlugin

      # Plugin Verifier against 2024.1 (the sinceBuild floor), the build target and the latest release.
      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/palette-audit/
            build/reports/pluginVerifier/
          if-no-files-found: ignore
